# slarti's own architecture, as vocabulary instances. The kinds come from the C4
# profile (slarti:c4), which docs/slarti/linkml/slarti.yaml imports. The diagrams
# in docs/architecture.md attach to these elements by their aliases.
elements:
  - id: architect
    kind: Person
    name: Architect
    description: Owns the prose; goals, constraints, decisions.
  - id: agent
    kind: Person
    name: LLM agent
    description: Edits model sources between sessions, with no memory of the repository.

  - id: slarti
    kind: SoftwareSystem
    name: slarti
    description: Checks architecture diagrams, LinkML schemas and SHACL shapes against each other.

  - id: slarti.cli
    kind: Container
    system: slarti
    name: CLI
    aliases: [cli]
    description: "typer commands: init, doctor, check, report."
  - id: slarti.runner
    kind: Container
    system: slarti
    name: Runner
    aliases: [runner]
    description: Orders delegated validations and slarti checks into one report.
  - id: slarti.checks
    kind: Container
    system: slarti
    name: Checks
    aliases: [checks]
    description: "The ownership, registry, diagram and document seams: OWN-*, REG-*, ATTACH-*, DOC-*."
  - id: slarti.findings
    kind: Container
    system: slarti
    name: Findings
    aliases: [findings]
    description: Stable rule IDs, remedies and the JSON report shape.
    owns: [Finding, Report, Summary]
  - id: slarti.registry
    kind: Container
    system: slarti
    name: Registry
    aliases: [registry]
    description: "Reads the constraint registry: the join table between prose and enforcement."
    owns: [Constraint, Enforcer]
  - id: slarti.models
    kind: Container
    system: slarti
    name: Models
    aliases: [models]
    description: Merges the vocabulary instances of every producer; LinkML via SchemaView, SHACL via rdflib.
    owns: [ModelElement, ModelRelation]
  - id: slarti.docsgen
    kind: Container
    system: slarti
    name: Document generator
    aliases: [docsgen]
    description: Generates tables and diagram blocks, and injects them between markers.
    owns: [Region]
  - id: slarti.env
    kind: Container
    system: slarti
    name: Environment gate
    aliases: [env]
    description: Probes every delegated tool the project uses and refuses to run outside the supported range.
    owns: [Probe]
  - id: slarti.settings
    kind: Container
    system: slarti
    name: Config
    aliases: [settings]
    description: "Reads slarti.toml: paths and the opt-ins of slarti's own checks, no mirrored settings."
    owns: [ProjectPaths]
  - id: slarti.adapters
    kind: Container
    system: slarti
    name: Adapters
    aliases: [adapters]
    description: >-
      Built-in producers: LikeC4 via export json, and Mermaid sequence, ER and C4
      diagrams parsed in Python, translated into vocabulary instances.
  - id: slarti.vocabulary
    kind: Container
    system: slarti
    name: Vocabulary
    aliases: [vocabulary]
    description: "The LinkML data contract adapters produce: diagrams, nodes, edges, elements, relations."
  - id: slarti.seams
    kind: Container
    system: slarti
    name: Seam report
    aliases: [seams]
    description: "slarti seams: the relations whose contracts a range of commits changed."
    owns: [Crossing, Hunk]
  - id: slarti.scaffold
    kind: Container
    system: slarti
    name: Scaffolder
    aliases: [scaffold]
    description: "slarti init: the conventional layout, written once, never overwritten."

  - id: likec4
    kind: SoftwareSystem
    external: true
    name: LikeC4
    description: An optional structure source and diagram generator. Invoked via npx --no-install, only when a project keeps a LikeC4 model.
  - id: linkml
    kind: SoftwareSystem
    external: true
    name: LinkML
    description: Validates the schema and generates projections. Invoked as a subprocess.
  - id: pyshacl
    kind: SoftwareSystem
    external: true
    name: pyshacl
    description: Validates negative fixtures against the hand-written shapes.
  - id: git
    kind: SoftwareSystem
    external: true
    name: git
    description: Describes the range of commits a seam report covers. Invoked as a subprocess.
  - id: sources
    kind: SoftwareSystem
    external: true
    name: Model sources
    description: Vocabulary instances, LinkML schemas, SHACL shapes, the constraint registry and the architecture document.

relations:
  - kind: Relationship
    source: architect
    target: slarti.cli
    description: runs check
    contract: slarti/cli.py
  - kind: Relationship
    source: agent
    target: slarti.cli
    description: runs check --json and applies remedies
    contract: Finding
  - kind: Relationship
    source: agent
    target: sources
    description: edits
    contract: slarti/vocabulary/vocabulary.yaml
  - kind: Relationship
    source: architect
    target: sources
    description: edits
    contract: slarti/vocabulary/vocabulary.yaml

  - kind: Relationship
    source: slarti.cli
    target: slarti.env
    description: gates on tool versions
    contract: Probe
  - kind: Relationship
    source: slarti.cli
    target: slarti.runner
    description: runs the checks
    contract: none
    contract_reason: "an in-process call; what comes back is the findings, whose contract is on checks -> findings"
  - kind: Relationship
    source: slarti.cli
    target: slarti.scaffold
    description: scaffolds a new project
    contract: none
    contract_reason: "an in-process call that takes only the project root"
  - kind: Relationship
    source: slarti.cli
    target: slarti.docsgen
    description: regenerates the document
    contract: Region
  - kind: Relationship
    source: slarti.cli
    target: slarti.settings
    description: resolves paths
    contract: slarti/config.py
  - kind: Relationship
    source: slarti.cli
    target: slarti.vocabulary
    description: reports the version
    contract: slarti/vocabulary/vocabulary.yaml

  - kind: Relationship
    source: slarti.cli
    target: slarti.seams
    description: reports the contracts a diff changes
    contract: Crossing
  - kind: Relationship
    source: slarti.seams
    target: slarti.models
    description: resolves the relations' contracts
    contract: slarti/models.py
  - kind: Relationship
    source: slarti.seams
    target: git
    description: diffs the range
    contract: none
    contract_reason: git's own diff output, read in its unified format

  - kind: Relationship
    source: slarti.runner
    target: slarti.checks
    description: collects findings
    contract: Finding
  - kind: Relationship
    source: slarti.runner
    target: slarti.registry
    description: loads the constraints
    contract: Constraint
  - kind: Relationship
    source: slarti.checks
    target: slarti.models
    description: reads both models
    contract: slarti/models.py
  - kind: Relationship
    source: slarti.checks
    target: slarti.findings
    description: emits findings
    contract: Finding
  - kind: Relationship
    source: slarti.checks
    target: pyshacl
    description: validates one negative fixture per rule
    contract: none
    contract_reason: "pyshacl's own command line, version-gated by the environment"

  - kind: Relationship
    source: slarti.docsgen
    target: slarti.models
    description: reads the model
    contract: slarti/models.py
  - kind: Relationship
    source: slarti.docsgen
    target: slarti.registry
    description: reads the rules
    contract: Constraint
  - kind: Relationship
    source: slarti.docsgen
    target: slarti.vocabulary
    description: resolves the vocabulary import
    contract: slarti/vocabulary/vocabulary.yaml
  - kind: Relationship
    source: slarti.docsgen
    target: likec4
    description: delegates diagram generation
    contract: none
    contract_reason: "LikeC4's own codegen command, version-gated by the environment gate"
  - kind: Relationship
    source: slarti.docsgen
    target: sources
    description: writes generated regions only
    contract: Region

  - kind: Relationship
    source: slarti.models
    target: slarti.vocabulary
    description: resolves the vocabulary import
    contract: slarti/vocabulary/vocabulary.yaml
  - kind: Relationship
    source: slarti.models
    target: slarti.adapters
    description: reads instances from
    contract: slarti/vocabulary/vocabulary.yaml
  - kind: Relationship
    source: slarti.models
    target: linkml
    description: SchemaView
    contract: none
    contract_reason: "LinkML's SchemaView API, version-gated by the environment gate"
  - kind: Relationship
    source: slarti.models
    target: sources
    description: reads
    contract: slarti/vocabulary/vocabulary.yaml

  - kind: Relationship
    source: slarti.adapters
    target: likec4
    description: export json
    contract: none
    contract_reason: "LikeC4's own export json, version-gated by the environment gate"
  - kind: Relationship
    source: slarti.adapters
    target: sources
    description: parses Mermaid diagrams in
    contract: docs/mermaid.md
  - kind: Relationship
    source: slarti.adapters
    target: slarti.vocabulary
    description: emits instances of
    contract: slarti/vocabulary/vocabulary.yaml

  - kind: Relationship
    source: slarti.env
    target: likec4
    description: probes the version
    contract: none
    contract_reason: "a version probe; only the reported version crosses"
  - kind: Relationship
    source: slarti.env
    target: linkml
    description: probes the version
    contract: none
    contract_reason: "a version probe; only the reported version crosses"

  - kind: Relationship
    source: slarti.registry
    target: sources
    description: reads
    contract: Constraint
