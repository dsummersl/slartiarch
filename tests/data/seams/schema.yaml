# The project schema every seam fixture is read against.
id: https://example.org/todo
name: todo
prefixes:
  todo: https://example.org/todo/
  linkml: https://w3id.org/linkml/
  slarti: https://dsummersl.github.io/slarti/
default_prefix: todo
default_range: string
imports:
  - linkml:types
  - slarti:vocabulary
classes:
  Service:
    is_a: Element
  Database:
    is_a: Element
  Reads:
    is_a: Relation
  Task:
    description: A thing to do.
    attributes:
      title:
        description: What to do.

  List:
    description: Tasks, in order.
