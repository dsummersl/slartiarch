id: https://dsummersl.github.io/slarti/vocabulary
name: slarti_vocabulary
title: The slarti vocabulary
description: >-
  The data contract every producer of slarti input conforms to. The
  structural layer records what a diagram says and knows no methodology. The
  architectural layer is the base a project extends, in its own schema, with the
  kinds of element and relation it means. Import it as `slarti:vocabulary`.
version: 0.4.0
license: Apache-2.0
prefixes:
  slarti_vocabulary: https://dsummersl.github.io/slarti/vocabulary/
  linkml: https://w3id.org/linkml/
default_prefix: slarti_vocabulary
default_range: string
imports:
  - linkml:types

classes:
  Corpus:
    description: Every diagram, element and relation one producer emits, checked together.
    tree_root: true
    attributes:
      diagrams:
        description: The diagrams the producer read.
        range: Diagram
        multivalued: true
        inlined_as_list: true
      elements:
        description: The architectural elements the project declares.
        range: Element
        multivalued: true
        inlined_as_list: true
      relations:
        description: The architectural relations the project declares.
        range: Relation
        multivalued: true
        inlined_as_list: true

  # Structural layer: what a diagram says.

  SourceLocation:
    description: Where a diagram, node or edge was written, in the terms of its source.
    attributes:
      file:
        description: The file the construct was read from, relative to the project root.
        required: true
      line:
        description: The line it starts on, when the source can be located.
        range: integer
        minimum_value: 1
      source_id:
        description: The identifier the construct carries in its own notation.
      label:
        description: The text the construct shows when rendered.

  Diagram:
    description: One diagram, as its notation states it.
    attributes:
      id:
        description: An identifier unique across the corpus.
        identifier: true
      location:
        description: Where the diagram was written.
        range: SourceLocation
        inlined: true
        required: true
      nodes:
        description: The nodes the diagram draws.
        range: Node
        multivalued: true
        inlined_as_list: true
      edges:
        description: The edges the diagram draws between its nodes.
        range: Edge
        multivalued: true
        inlined_as_list: true

  Disposition:
    description: >-
      How a node or edge stands to the architecture: attached to what it depicts,
      or ignored with a reason. There is no third state.
    mixin: true
    attributes:
      ignored:
        description: Why the construct depicts nothing in the architecture.

  Node:
    description: A box, participant or state drawn in a diagram.
    mixins:
      - Disposition
    attributes:
      id:
        description: An identifier unique across the corpus.
        identifier: true
      kind:
        description: >-
          The structural class of the node, such as Participant or Entity, when
          the notation says more than that it is a node.
        designates_type: true
        range: string
      location:
        description: Where the node was written.
        range: SourceLocation
        inlined: true
        required: true
      element:
        description: The id or an alias of the element the node depicts.
      element_kinds:
        description: >-
          The element kinds the notation says the depicted element is one of,
          such as the classes a Mermaid node is assigned.
        multivalued: true

  Edge:
    description: A line drawn from one node to another.
    mixins:
      - Disposition
    attributes:
      kind:
        description: >-
          The structural class of the edge, such as Message or
          EntityRelationship, when the notation says more than that it is an edge.
        designates_type: true
        range: string
      source:
        description: The node the edge starts at.
        range: Node
        required: true
      target:
        description: The node the edge ends at.
        range: Node
        required: true
      location:
        description: Where the edge was written.
        range: SourceLocation
        inlined: true
        required: true
      relation:
        description: >-
          The kind of relation the edge depicts, between the elements its
          endpoints depict.

  # Sequence diagrams.

  Participant:
    description: A lifeline in a sequence diagram.
    is_a: Node
    attributes:
      actor:
        description: Drawn as a person rather than a box.
        range: boolean

  Message:
    description: A message one participant sends another, in the order the diagram sends it.
    is_a: Edge
    attributes:
      order:
        description: The message's position among the diagram's messages, from 1.
        range: integer
        minimum_value: 1
        required: true
      arrow:
        description: The arrow as written, which says whether the message is a call or a reply.

  # Entity-relationship diagrams.

  Entity:
    description: An entity in an entity-relationship diagram.
    is_a: Node
    attributes:
      attributes:
        description: The attributes the diagram lists for the entity.
        range: EntityAttribute
        multivalued: true
        inlined_as_list: true

  EntityAttribute:
    description: One attribute of an entity, as an entity-relationship diagram lists it.
    attributes:
      name:
        description: What the attribute is called.
        required: true
      type:
        description: The attribute's type, as written.
        required: true
      keys:
        description: The keys the attribute takes part in.
        range: EntityKey
        multivalued: true
      comment:
        description: The comment written beside the attribute.

  EntityRelationship:
    description: A relationship between two entities, with the cardinality at each end.
    is_a: Edge
    attributes:
      source_cardinality:
        description: How many of the source entity one target entity relates to.
        range: Cardinality
        required: true
      target_cardinality:
        description: How many of the target entity one source entity relates to.
        range: Cardinality
        required: true
      identifying:
        description: Whether the target cannot exist without the source (a solid line).
        range: boolean

  # Architectural layer: what the user means. Projects extend these.

  Element:
    description: A thing in the architecture. A project subclasses it with the kinds it uses.
    abstract: true
    attributes:
      id:
        description: The permanent identifier the element is resolved by.
        identifier: true
      kind:
        description: The class of the instance, which lets a corpus hold any project kind.
        designates_type: true
        range: string
      name:
        description: What the element is called.
        required: true
      aliases:
        description: Other names a diagram may use for this element.
        multivalued: true
      description:
        description: What the element is for.
      owns:
        description: The project schema classes this element is responsible for.
        multivalued: true

  Relation:
    description: A directed dependency between two elements. A project subclasses it.
    abstract: true
    attributes:
      kind:
        description: The class of the instance, which lets a corpus hold any project kind.
        designates_type: true
        range: string
      source:
        description: The element the relation starts at.
        range: Element
        required: true
      target:
        description: The element the relation ends at.
        range: Element
        required: true
      description:
        description: What the relation means.

enums:
  Cardinality:
    description: How many instances one end of an entity relationship admits.
    permissible_values:
      zero_or_one:
        description: At most one.
      exactly_one:
        description: Exactly one.
      zero_or_more:
        description: Any number, including none.
      one_or_more:
        description: At least one.

  EntityKey:
    description: A key an entity attribute takes part in.
    permissible_values:
      PK:
        description: Primary key.
      FK:
        description: Foreign key.
      UK:
        description: Unique key.
