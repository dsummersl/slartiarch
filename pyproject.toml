[project]
name = "slartiarch"
version = "1.0.0"
description = "A coordination CLI for validated architecture documentation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Dane Summers", email = "dsummersl@gmail.com" }
]
license = "Apache-2.0"
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]
dependencies = [
  "typer>=0.27",
  "linkml-runtime>=1.11.1",
  "rdflib>=7.6",
  "pyyaml>=6.0.3",
  "tomli-w>=1.2",
  "pydantic>=2.11",
  "pyshacl>=0.25",
  "linkml>=1.11,<2",
  "lark>=1.2",
]

[project.urls]
Repository = "https://github.com/dsummersl/slartiarch"

[project.scripts]
slartiarch = "slarti.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slarti"]

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-cov>=7.1",
  "ruff>=0.16",
  "mypy>=2.3",
  "pre-commit>=4.6",
  "radon>=6.0.1",
  "treepeat>=0.9.0",
  "vulture>=2.16",
  "types-PyYAML>=6.0.12",
]

[tool.ruff]
line-length = 100
# slarti/domain.py is GENERATED from model/schema/slarti.yaml (`make domain`).
exclude = [".venv", ".git", "build", "dist", "slarti/domain.py"]
lint.select = [
  "E",   # pycodestyle
  "F",   # Pyflakes
  "I",   # isort (automatically sorts and moves imports to top)
  "B",   # flake8-bugbear (find likely bugs and design problems in your program)
  "PLR", # Pylint Refactor (specifically catches misplaced imports)
  "PLC", # Pylint Convention (specifically catches imports not at the top of the file)
  "TID", # Tidy imports
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["PLR2004"] # Allow magic numbers in tests

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["slarti"]

[[tool.mypy.overrides]]
module = ["linkml_runtime.*", "linkml.*"]
ignore_missing_imports = true

# GENERATED code: the schema is reviewed, the projection of it is not.
[[tool.mypy.overrides]]
module = ["slarti.domain"]
ignore_errors = true

[tool.vulture]
# typer registers these as commands; vulture cannot see the decorator.
ignore_names = ["doctor", "report_command", "_version_callback"]
# GENERATED: every generated slot looks unused to a caller-graph scan.
exclude = ["slarti/domain.py"]

[tool.slartiarch.paths]
likec4 = "docs/slarti/likec4"
linkml = "docs/slarti/linkml"
shacl = "docs/slarti/shacl"
constraints = "docs/slarti/constraints.yaml"
shacl_valid = "docs/slarti/data/valid"
shacl_invalid = "docs/slarti/data/invalid"
documents = ["docs/architecture.md"]
mermaid = ["docs/architecture.md"]

[tool.pytest.ini_options]
addopts = "--cov=slarti  --cov-report=term-missing"
